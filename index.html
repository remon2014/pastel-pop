<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#332C2E" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pastel Pop</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #332C2E;
        color: #D9CEC2;
      }

      canvas#gameCanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        z-index: 0;
      }

      #gameUI {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 10;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      #infoPanel {
        display: flex;
        justify-content: center;
        padding-top: max(20px, env(safe-area-inset-top));
      }

      #targetCanvas {
        display: block;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* 🎮 Main Menu Styles */
      #mainMenu {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 20;
        width: 100vw;
        height: 100vh;
        background: #332C2E;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        pointer-events: auto;
        gap: 20px;
      }

      #mainMenu h1 {
        font-size: 48px;
        font-weight: 700;
        margin: 0;
        color: #D9CEC2;
      }

      /* Flat buttons: Cream text on Glow 1 (7.0:1), Glow 2 on hover (5.1:1) */
      .button-17 {
        appearance: none;
        background-color: #453B3C;
        border: none;
        border-radius: 24px;
        color: #D9CEC2;
        cursor: pointer;
        font-family: inherit;
        font-size: 16px;
        font-weight: 500;
        min-height: 48px;
        padding: 0 24px;
      }

      .button-17:hover {
        background-color: #5C4F4C;
      }

      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #332C2E;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 30;
      }

      .pause-menu {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .pause-menu h2 {
        margin: 0;
        color: #D9CEC2;
      }

    </style>
  </head>

  <body>
    <canvas id="gameCanvas"></canvas>
    <button id="pauseBtn" class="button-17" style="position:absolute; top:20px; right:20px; z-index:15;">Pause</button>
    <div id="gameUI">
      <div id="infoPanel">
        <div>
          <canvas id="targetCanvas" aria-hidden="true"></canvas>
          <span id="targetLabel" class="visually-hidden" aria-live="polite"></span>
        </div>
      </div>

    </div>

    <!-- 🎮 Main Menu -->
    <div id="mainMenu">
      <h1>Pastel Pop</h1>
      <button id="startGameBtn" class="button-17" role="button">Start Game</button>
    </div>

      <!-- 🛑 Pause Overlay -->
  <div id="pauseOverlay" class="overlay">
    <div class="pause-menu">
      <h2>Game Paused</h2>
      <button id="continueBtn" class="button-17">Continue Playing</button>
      <button id="backToMainBtn" class="button-17">Return to Main Menu</button>
    </div>
  </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
