<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#a3c4dc" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pastel Pop</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        font-family: 'Inter', sans-serif;
      }

      canvas#gameCanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        z-index: 0;
      }

      #gameUI {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 10;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      #infoPanel {
        padding: 20px;
        pointer-events: none;
      }

      #targetSwatch {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 2px solid rgba(0, 0, 0, 0.15);
        background-color: transparent;
      }

      /* 🎮 Main Menu Styles */
      #mainMenu {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 20;
        width: 100vw;
        height: 100vh;
        background: rgba(255, 255, 255, 0.96);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        pointer-events: auto;
        gap: 20px;
      }

      #mainMenu h1 {
        font-size: 48px;
        font-weight: 700;
        margin: 0;
        background: linear-gradient(90deg, #ffb6c1, #b5d8ff, #b2f2bb);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-fill-color: transparent;
      }

      /* ✅ Material-style pastel button */
      .button-17 {
        appearance: none;
        background-color: #f0f7ff;
        border: none;
        border-radius: 24px;
        box-shadow: rgba(0, 0, 0, .2) 0 3px 5px -1px,
                    rgba(0, 0, 0, .14) 0 6px 10px 0,
                    rgba(0, 0, 0, .12) 0 1px 18px 0;
        color: #3c4043;
        cursor: pointer;
        font-family: "Inter", sans-serif;
        font-size: 16px;
        font-weight: 500;
        height: 48px;
        padding: 0 24px;
        transition: box-shadow 280ms cubic-bezier(.4, 0, .2, 1),
                    transform 270ms cubic-bezier(0, 0, .2, 1) 0ms;
        will-change: transform, opacity;
      }

      .button-17.black {
        background-color: #333;
        color: #fff;
      }

      .button-17.black:hover {
        background-color: #000;
        color: #fff;
      }

      .button-17:hover {
        background: #e0efff;
        color: #174ea6;
      }

      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.96);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 30;
      }

      .pause-menu {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

    </style>
  </head>

  <body>
    <canvas id="gameCanvas"></canvas>
    <button id="pauseBtn" class="button-17" style="position:absolute; top:20px; right:20px; z-index:15;">Pause</button>
    <div id="gameUI">
      <div id="infoPanel">
        <div id="targetSwatch" role="img" aria-label="Target colour"></div>
      </div>

    </div>

    <!-- 🎮 Main Menu -->
    <div id="mainMenu">
      <h1>Pastel Pop</h1>
      <button id="startGameBtn" class="button-17" role="button">Start Game</button>
    </div>

      <!-- 🛑 Pause Overlay -->
  <div id="pauseOverlay" class="overlay">
    <div class="pause-menu">
      <h2>Game Paused</h2>
      <button id="continueBtn" class="button-17 black">Continue Playing</button>
      <button id="backToMainBtn" class="button-17">Return to Main Menu</button>
    </div>
  </div>

    <script type="module" src="./src/main.js?v=1.0.3"></script>
  </body>
</html>
